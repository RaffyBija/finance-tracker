name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Placeholder: prisma generate legge lo schema e richiede che la env
      # var sia definita, ma non si connette al DB (nessuna migrazione qui).
      DATABASE_URL: postgresql://user:password@localhost:5432/finance_tracker_ci
      JWT_SECRET: ci-placeholder-secret-non-usato-in-produzione
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npm run build
      - run: npm test -- --run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      # Errori di lint bloccanti; le regole React 19 rimaste in warning sono debito noto (eslint.config.js).
      - run: npm run lint
